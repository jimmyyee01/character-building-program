<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Console</title>
<link rel="stylesheet" href="/css/style.css?v=9">
<style>
  .view { display: none; }
  .view.active { display: block; }
  .avatar-sm { width: 34px; height: 34px; border-radius: 50%; object-fit: cover;
    vertical-align: middle; border: 1px solid var(--line); margin-right: 6px; }
  .code-chip { font-family: Consolas, monospace; background: #eef2fa; color: var(--brand-2);
    border: 1px dashed var(--brand); padding: 3px 9px; border-radius: 8px; font-weight: 700;
    letter-spacing: .06em; display: inline-block; }
  .table-wrap { overflow-x: auto; }
  .opt-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
  .opt-row input[type=radio] { width: auto; flex: 0 0 auto; }
  .opt-row input[type=text] { flex: 1; width: auto; min-width: 0; }
  details.exp summary { cursor: pointer; color: var(--brand); font-weight: 600; font-size: 13px; }
  .thumb { height: 64px; max-width: 190px; object-fit: contain; background: #fff;
    border: 1px solid var(--line); border-radius: 8px; padding: 4px; margin-bottom: 8px; }
  .cert-logos { display: flex; justify-content: center; gap: 18px; align-items: center; flex-wrap: wrap; }
  #sessionMsg { max-width: 560px; margin: 60px auto; text-align: center; }
  .form-note { background: #f6f8fd; border: 1px dashed var(--line); border-radius: 10px;
    padding: 12px 14px; margin-top: 12px; }
  .qform { background: #f6f8fd; border: 1px dashed var(--line); border-radius: 10px;
    padding: 14px; margin-top: 12px; }
  .chap { border: 1px solid var(--line); border-left: 4px solid var(--brand); border-radius: 10px;
    padding: 14px 16px; margin-top: 14px; background: #fff; }
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <img id="logoTenant" class="hidden" alt="Organization logo">
    <span id="tenantName">Admin Console</span>
  </div>
  <div class="spacer"></div>
  <div class="who">
    <span id="whoName"></span>
    <button type="button" id="btnLogout" class="ghost small">Log out</button>
  </div>
</header>

<div class="shell">
  <aside class="side">
    <nav id="nav">
      <button type="button" class="nav-btn active" data-view="dashboard">Dashboard</button>
      <button type="button" class="nav-btn" data-view="users" id="navUsers">Users</button>
      <button type="button" class="nav-btn admin-only" data-view="supervisors">Supervisors</button>
      <button type="button" class="nav-btn admin-only" data-view="library">Library</button>
      <button type="button" class="nav-btn admin-only" data-view="books">Modules &amp; Books</button>
      <button type="button" class="nav-btn" data-view="submissions">Submissions</button>
      <button type="button" class="nav-btn" data-view="certificates">Certificates</button>
      <button type="button" class="nav-btn admin-only" data-view="branding">Branding</button>
    </nav>
  </aside>
  <main class="main">
    <div id="sessionMsg" class="card hidden">
      <h3>Sign-in required</h3>
      <p class="muted">You need to sign in as a tenant administrator or supervisor to open this console.</p>
      <p><a href="/">&larr; Back to the portal list</a></p>
    </div>
    <section id="view-dashboard" class="view active"></section>
    <section id="view-users" class="view"></section>
    <section id="view-supervisors" class="view"></section>
    <section id="view-library" class="view"></section>
    <section id="view-books" class="view"></section>
    <section id="view-submissions" class="view"></section>
    <section id="view-certificates" class="view"></section>
    <section id="view-branding" class="view"></section>
  </main>
</div>

<div id="modalRoot"></div>

<script src="/js/common.js?v=9"></script>
<script src="/js/admin.js?v=9"></script>
</body>
</html>
